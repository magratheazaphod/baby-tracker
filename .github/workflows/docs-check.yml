# On every PR, have Claude compare the diff against the repo's documentation
# and comment on anything that has gone stale. Comment-only by design: main is
# what's deployed, so doc fixes go through the normal review path rather than
# a bot pushing to the branch.
#
# Needs one repository secret: ANTHROPIC_API_KEY (or swap in
# CLAUDE_CODE_OAUTH_TOKEN via `claude setup-token`). GitHub withholds secrets
# from fork PRs, and the `if:` below makes that explicit.
name: Docs accuracy check

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  docs-check:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: >-
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),mcp__github_inline_comment__create_inline_comment"
            --max-turns 15
          prompt: |
            You are the documentation reviewer for this pull request.

            1. Read the PR diff (`git diff origin/${{ github.base_ref }}...HEAD`).
            2. Check every documentation surface for statements that the diff
               makes stale, inaccurate, or incomplete:
               README.md (feature list, env-var table, setup steps),
               CLAUDE.md (architecture map, key patterns, lifecycle notes),
               .env.example and fly.toml.example (every config key the code
               reads must be documented; every documented key must exist),
               docs/roadmap.md and docs/*.md.
            3. Post ONE PR comment. If everything is accurate, say so in one
               line. Otherwise list each stale statement as: file, the current
               wording, what the code now does, and the suggested replacement
               text. Be specific enough that the author can apply it without
               re-investigating.

            Rules: do not edit files or push commits. Do not comment on code
            quality; that is another reviewer's job. This repository is
            public and serves a real family: never quote or infer personal
            details (names, dates, app hostnames), and flag it if the diff
            introduces any.
